name: Sync to Hugging Face Space

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to Hugging Face Space (Bearer token)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is empty. Check GitHub Secrets -> Actions -> HF_TOKEN."
            exit 1
          fi

          # ✅ HF Space git remote 추가 (중요: 끝에 슬래시 X)
          git remote remove hf 2>/dev/null || true
          git remote add hf https://huggingface.co/spaces/hihi12121/ppt_auto

          # ✅ 인증 헤더를 강제로 붙여서 push
          git -c http.https://huggingface.co/.extraHeader="Authorization: Bearer ${HF_TOKEN}" push --force hf HEAD:main