name: Sync to Hugging Face Space

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - name: Push to Hugging Face Space (Bearer token)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is empty. Check GitHub Secrets -> Actions -> HF_TOKEN."
            exit 1
          fi

          # Hugging Face Space repo URL (no creds in URL)
          HF_URL="https://huggingface.co/spaces/hihi12121/ppt_auto"

          # Push using Authorization: Bearer header
          git -c http.extraHeader="Authorization: Bearer ${HF_TOKEN}" push --force "${HF_URL}" main