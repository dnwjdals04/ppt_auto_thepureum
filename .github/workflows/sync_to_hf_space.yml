name: Sync to Hugging Face Space

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 토큰이 실제로 들어왔는지(빈 값이면 바로 실패)
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is empty. Check GitHub Actions secret HF_TOKEN."
            exit 1
          fi

          # HF Space로 토큰 포함 URL로 push
          git push --force "https://hihi12121:${HF_TOKEN}@huggingface.co/spaces/hihi12121/ppt_auto" main