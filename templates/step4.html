<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Step 4</title>
  <style>
    :root{--bg:#0b1020;--text:#e7ecff;--muted:#a7b0d6;--line:#253055;--primary:#6ea8ff;--danger:#ff6b6b;--shadow:0 10px 30px rgba(0,0,0,.35);--radius:16px;}
    *{box-sizing:border-box}
    body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",Arial,"Apple SD Gothic Neo",sans-serif;color:var(--text);background:radial-gradient(1200px 800px at 20% 10%, rgba(110,168,255,.18), transparent 60%),radial-gradient(900px 600px at 80% 30%, rgba(143,104,255,.14), transparent 60%),linear-gradient(180deg,#070a14,#0b1020 55%,#080b16);min-height:100vh;}
    .wrap{max-width:880px;margin:0 auto;padding:32px 18px 56px;}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;}
    .brand{display:flex;flex-direction:column;gap:4px;}
    .brand .title{font-weight:800;letter-spacing:-.02em;font-size:20px;}
    .brand .sub{color:var(--muted);font-size:13px;}
    .progress{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;}
    .pill{border:1px solid var(--line);background:rgba(255,255,255,.04);padding:8px 10px;border-radius:999px;color:var(--muted);font-size:12px;}
    .pill.active{background:rgba(110,168,255,.14);border-color:rgba(110,168,255,.35);color:var(--text);}
    .card{background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));border:1px solid rgba(37,48,85,.8);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
    .card-hd{padding:18px;border-bottom:1px solid rgba(37,48,85,.65);background:rgba(15,23,48,.65);}
    .card-hd h1{margin:0;font-size:18px;letter-spacing:-.02em;}
    .card-hd p{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
    .card-bd{padding:18px;}
    .cta{
      display:flex;gap:10px;flex-wrap:wrap;
      margin-top:14px;
    }
    .btn{
      border:1px solid rgba(37,48,85,.85);
      background:rgba(255,255,255,.05);
      color:var(--text);
      padding:12px 14px;
      border-radius:12px;
      cursor:pointer;
      font-weight:900;
      letter-spacing:-.01em;
      min-width:180px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }
    .btn.primary{
      border-color:rgba(110,168,255,.55);
      background:linear-gradient(180deg, rgba(110,168,255,.22), rgba(75,125,255,.16));
    }
    .btn:disabled{opacity:.6;cursor:not-allowed;}
    .status{
      margin-top:14px;
      color:var(--muted);
      font-size:13px;
      line-height:1.45;
    }
    .toast{
      margin-top:12px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(37,48,85,.7);
      background:rgba(15,23,48,.55);
      color:var(--muted);
      display:none;
    }
    .toast.show{display:block;}
    .toast.error{
      border-color:rgba(255,107,107,.45);
      background:rgba(255,107,107,.10);
      color:#ffd7d7;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="title">PPT Auto</div>
        <div class="sub">예배 PPT 자동 생성 · Step 4/4</div>
      </div>
      <div class="progress">
        <div class="pill">1 기본</div>
        <div class="pill">2 곡</div>
        <div class="pill">3 가사</div>
        <div class="pill active">4 생성</div>
      </div>
    </div>

    <div class="card">
      <div class="card-hd">
        <h1>Step 4) PPT 생성</h1>
        <p>PPT를 생성한 뒤 자동으로 다운로드합니다. 생성 중에는 버튼이 잠깁니다.</p>
      </div>

      <div class="card-bd">
        <div class="cta">
          <button class="btn primary" id="btnGen" onclick="makePpt()">
            <span>📦</span> PPT 생성 · 다운로드
          </button>
          <button class="btn" onclick="location.href='/step/3?plan_id={{plan_id}}'">
            <span>↩️</span> Step 3로 돌아가기
          </button>
        </div>

        <div class="status" id="status">
          파일명은 <b>thepureum_YYYYMMDD.pptx</b> 형식으로 저장됩니다.
        </div>

        <div class="toast" id="toast"></div>
      </div>
    </div>
  </div>

  <script>
    function yyyymmdd(){
      const d = new Date();
      const mm = String(d.getMonth()+1).padStart(2,'0');
      const dd = String(d.getDate()).padStart(2,'0');
      return `${d.getFullYear()}${mm}${dd}`;
    }

    function setToast(msg, isError=false){
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.toggle("error", !!isError);
      t.classList.add("show");
    }

    function clearToast(){
      const t = document.getElementById("toast");
      t.classList.remove("show");
      t.classList.remove("error");
      t.textContent = "";
    }

    async function makePpt(){
      clearToast();
      const btn = document.getElementById("btnGen");
      const status = document.getElementById("status");

      btn.disabled = true;
      const prev = btn.innerHTML;
      btn.innerHTML = "<span>⏳</span> 생성 중...";

      status.textContent = "서버에서 PPT를 생성하고 있습니다. 잠시만 기다려주세요...";

      try{
        const res = await fetch(`/api/ppt/${encodeURIComponent("{{plan_id}}")}/generate`, {method:"POST"});
        if(!res.ok){
          const txt = await res.text();
          setToast("생성 실패: " + txt, true);
          status.textContent = "생성에 실패했습니다. Step 3에서 가사를 확인하거나 잠시 후 다시 시도해 주세요.";
          return;
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `thepureum_${yyyymmdd()}.pptx`;
        a.click();
        URL.revokeObjectURL(url);

        setToast("다운로드가 시작됐어요 ✅");
        status.textContent = "다운로드가 시작되지 않으면 브라우저 다운로드 차단 여부를 확인해 주세요.";
      } catch(e){
        setToast("네트워크 오류: " + (e?.message || e), true);
        status.textContent = "네트워크 오류가 발생했습니다. 다시 시도해 주세요.";
      } finally{
        btn.disabled = false;
        btn.innerHTML = prev;
      }
    }
  </script>
</body>
</html>
